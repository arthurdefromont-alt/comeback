  function D(){return STR[LANG]||STR.en;}
  function V(k){const d=D();return d[k]!=null?d[k]:STR.en[k];}
  function tr(k,p){let s=V(k);if(s==null)return k;if(typeof s==='function')return s(p||{});return String(s).replace(/\{(\w+)\}/g,(m,x)=>p&&p[x]!=null?String(p[x]):m);}
  function setLang(l){LANG=STR[l]?l:'ru';return LANG;}
  function getLang(){return LANG;}
  function withLang(l,fn){const prev=LANG;LANG=STR[l]?l:prev;try{return fn();}finally{LANG=prev;}}
  function nf(x){const s=String(x);return LANG==='ru'?s.replace('.',','):s;}
  function scramble(s){
    let seed=String(s).length*7+3;const LAT='abcdefghijklmnopqrstuvwxyz',CYR='абвгдежзиклмнопрстуфхцчшщыэюя';
    return String(s).replace(/[A-Za-z0-9Ѐ-ӿ]/g,c=>{seed=(seed*31+7)%997;
      if(c>='0'&&c<='9')return String(seed%10);
      const set=/[Ѐ-ӿ]/.test(c)?CYR:LAT,ch=set[seed%set.length];
      return c!==c.toLowerCase()?ch.toUpperCase():ch;});
  }

  function pct(reps,rpe){const i=Math.round((reps+(10-rpe)-1)*2);return RTS[Math.max(0,Math.min(RTS.length-1,i))]/100;}
  function e1rm(kg,reps,rpe){return kg/pct(reps,rpe);}
  function dn(s){const p=String(s).split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}
  function ds(n){return new Date(n*864e5).toISOString().slice(0,10);}
  function wday(n){return (new Date(n*864e5).getUTCDay()+6)%7;}
  function wkStart(n){return n-wday(n);}
  function isNum(v){return typeof v==='number'&&isFinite(v);}
  function r1(x){return Math.round(x*10)/10;}
  function fmtDay(n){const d=new Date(n*864e5),w=V('wd')[wday(n)],m=V('mon')[d.getUTCMonth()];return LANG==='ru'?w+', '+d.getUTCDate()+' '+m:w+' '+d.getUTCDate()+' '+m;}
  function fmtShort(n){const d=new Date(n*864e5);return d.getUTCDate()+' '+V('mon')[d.getUTCMonth()];}
  function fmtH(h){let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H++;M=0;}return LANG==='ru'?H+' ч'+(M?' '+M+' мин':''):H+'h'+(M?String(M).padStart(2,'0'):'');}
  function signed(x,dp){return (x>=0?'+':'−')+nf(Math.abs(x).toFixed(dp));}

  function weekMetrics(mon,daily,sessions){

    let bench=null;ss.forEach(s=>{if(s.type==='muscu'){const e=testE1(s);if(e!==null&&(bench===null||e>bench))bench=e;}});

  function weekChecks(L,wk){

/* The summary always goes out in English so Arthur can read it. */
function summaryEn(){
  const L=C.L,lines=[],win=C.weeks.slice(-4);
  lines.push('Comeback · '+fmtDay(C.today));
  lines.push('Levels now: '+TYPES.map(ty=>nm(ty)+' P'+L[ty].level).join(' · ')+' · '+C.freq.level+' sessions/week');
  if(!win.length){lines.push('No full week logged yet.');}
  else{
    const from=win[0].mon,to=win[win.length-1].sun;
    let sl=0,sln=0,m3=0,mn=0,wh=0,bk=0,bkn=0,waist=null;
    for(let d=from;d<=to;d++){
      const e=S.daily[E.ds(d)];if(!e)continue;
      if(isNum(e.sleep)){sl+=e.sleep;sln++;}
      if(isNum(e.meals)){mn++;if(e.meals>=3)m3++;}
      if(e.whisky===true)wh++;
      if(isNum(e.back)){bk+=e.back;bkn++;}
      if(isNum(e.waist))waist=e.waist;
    }
    const ses=win.reduce((a,w)=>a+w.sessions,0),tgt=win.reduce((a,w)=>a+w.target,0);
    const ev=C.events.filter(e=>e.d>=from);
    if(ev.length)lines.push('Level changes: '+ev.map(e=>eventText(e).replace(/: .*/,'')+' ('+fmtShort(e.d)+')').join(', '));
    lines.push(win.length+' week'+(win.length>1?'s':'')+' from '+fmtShort(from)+': '+ses+'/'+tgt+' sessions · sleep '+(sln?fmtH(sl/sln):'–')+' · 3+ full meals '+m3+'/'+mn+' days · whisky '+wh+' evenings · back '+(bkn?r1(bk/bkn)+'/10':'–'));
    const ws=win.filter(w=>w.weight!==null);
    if(ws.length){const a=ws[0].weight,b=ws[ws.length-1].weight;
      lines.push('Weight: '+(ws.length>1?r1(a)+' → '+r1(b)+' kg ('+signed(b-a,1)+')':r1(a)+' kg')+(waist!==null?' · waist '+waist+' cm':''));}
    const tests=C.sessions.filter(s=>s.type==='muscu'&&dn(s.date)>=from&&testE1(s)!==null);
    if(tests.length){const first=tests[0];let best=first;tests.forEach(s=>{if(testE1(s)>testE1(best))best=s;});
      lines.push('Bench: '+fmtSet(first.data.test)+' (e1RM '+r1(testE1(first))+')'+(best!==first?' → best '+fmtSet(best.data.test)+' (e1RM '+r1(testE1(best))+')':''));}
    const fl=C.sessions.filter(s=>dn(s.date)>=from&&anyFlag(s.flags));
    lines.push('Stop signals: '+(fl.length?fl.map(s=>fmtShort(dn(s.date))+' '+flagNames(s.flags).join(', ')).join('; '):'none'));
  }
  TYPES.forEach(ty=>{const Lt=L[ty];if(Lt.goal){lines.push(nm(ty)+': goal reached');return;}
    const miss=criteria(ty,Lt,C.today,C.ctx).items.filter(i=>!i.ok).map(i=>i.label);
    lines.push(nm(ty)+' next: '+(miss.length?miss[0]:'ready, unlocks next session'));});
  return lines.join('\n');
}

  const p=S.profile,lb=S.meta.lastBackup,pv=x=>x==null?'':esc(nf(x));
  $('#data').innerHTML='<div class="stack">'+
    '<article class="card"><h2>'+esc(tr('dt.sumTitle'))+'</h2><p class="hint">'+esc(tr('dt.sumHint'))+'</p><textarea class="input" id="sum-text" rows="9">'+esc(summaryText())+'</textarea><div class="row"><button type="button" class="btn" data-act="copy-sum">'+esc(tr('dt.copySum'))+'</button></div></article>'+
    '<article class="card"><h2>'+esc(tr('dt.backupTitle'))+'</h2><p class="hint">'+esc(tr('dt.backupHint'))+'</p><p class="small">'+esc(tr('dt.last'))+' <b id="last-backup">'+esc(lb?fmtDay(dn(lb)):tr('dt.never'))+'</b></p><div class="row"><button type="button" class="btn" data-act="copy-backup">'+esc(tr('dt.copyBackup'))+'</button></div><textarea class="input" id="backup-text" rows="3" hidden></textarea>'+
      '<div class="field"><label for="restore-text">'+esc(tr('dt.restoreLabel'))+'</label><textarea class="input" id="restore-text" rows="3" placeholder="'+esc(tr('dt.restorePh'))+'"></textarea></div><div class="row"><button type="button" class="btn warn" data-act="restore">'+esc(tr('dt.restore'))+'</button></div></article>'+
    '<form class="card" id="setup-form" novalidate><h2>'+esc(tr('dt.startTitle'))+'</h2><p class="hint">'+esc(tr('dt.startHint'))+'</p>'+
      '<div class="grid2"><div class="field"><label for="su-start">'+esc(tr('dt.startDate'))+'</label><input class="input" type="date" id="su-start" value="'+esc(p.startDate)+'" max="'+todayStr()+'"></div>'+
      '<div class="field"><label for="su-weight">'+esc(tr('dt.startWeight'))+'</label><input class="input" id="su-weight" inputmode="decimal" value="'+pv(p.startWeight)+'"></div>'+
      '<div class="field"><label for="su-waist">'+esc(tr('dt.startWaist'))+'</label><input class="input" id="su-waist" inputmode="decimal" value="'+pv(p.startWaist)+'"></div>'+
      '<div class="field"><label for="su-height">'+esc(tr('dt.height'))+'</label><input class="input" id="su-height" inputmode="decimal" value="'+pv(p.height)+'"></div></div>'+
      '<div class="row"><button type="submit" class="btn ghost">'+esc(tr('dt.save'))+'</button></div></form>'+
    '<article class="card"><h2>'+esc(tr('dt.exTitle'))+'</h2><p class="hint">'+esc(tr('dt.exHint'))+'</p><div class="row"><button type="button" class="btn ghost" data-act="'+(demo?'exit-demo':'demo')+'">'+esc(tr(demo?'dt.exExit':'dt.exShow'))+'</button></div></article>'+
    '<article class="card"><h2>'+esc(tr('dt.resetTitle'))+'</h2><p class="hint">'+esc(tr('dt.resetHint'))+'</p><div class="row"><button type="button" class="btn warn" data-act="reset">'+esc(tr('dt.resetBtn'))+'</button></div></article>'+
  '</div>';
}

let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3400);}
function arm(b,fn){
  if(b.dataset.armed==='1'){fn();return;}
  b.dataset.armed='1';b.dataset.orig=b.textContent;b.textContent=tr('tt.confirm');b.classList.add('armed');
  setTimeout(()=>{if(b.isConnected&&b.dataset.armed==='1'){b.dataset.armed='';b.textContent=b.dataset.orig;b.classList.remove('armed');}},4000);
}
function copyText(text,ta,msg){
  const fallback=()=>{if(ta){ta.hidden=false;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length);}catch(e){}}toast(tr('tt.hold'));};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg||tr('tt.copied')),fallback);else fallback();}catch(e){fallback();}
}
function showTab(id){
  if(TABS.indexOf(id)<0)id='today';
  document.querySelectorAll('main .tab').forEach(s=>{s.hidden=s.id!==id;});
  document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===id?'page':'false'));
  try{localStorage.setItem(UIKEY,id);}catch(e){}
  window.scrollTo(0,0);
}

function saveLog(){
  const td=todayStr(),date=$('#lg-date').value,type=$('#lg-type').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast(tr('tt.pickDate'));return;}
  if(date>td){toast(tr('tt.future'));return;}
  if(date<S.profile.startDate){toast(tr('tt.beforeStart'));return;}
  const lvl=C.L[type].level,s={id:newId(),t:Date.now(),date:date,type:type,data:{},flags:{}};
  if(type==='muscu'){
    const kg=num($('#lg-kg').value),reps=num($('#lg-reps').value),rpe=num($('#lg-rpe').value);
    if(kg!==null||reps!==null||rpe!==null){
      if(kg===null||reps===null||rpe===null){toast(tr('tt.fillTest'));return;}
      if(kg<20||kg>400){toast(tr('tt.checkKg'));return;}
      s.data.test={kg:kg,reps:reps,rpe:rpe};
    }
  }else if(type==='cardio'){
    s.data.full=chk('lg-full');
    if(lvl<=3)s.data.talk=chk('lg-talk');
    else if(lvl<=5)s.data.recov=chk('lg-recov');
    else{const b=[1,2,3,4].map(i=>num($('#lg-b'+i).value));
      if(b.some(x=>x!==null)){if(b.some(x=>x===null||x<=0)){toast(tr('tt.fillBlocks'));return;}s.data.blocks=b;}}
  }else{
    if(lvl<=2)s.data.rpe7=chk('lg-rpe7');
    else if(lvl===3)s.data.emom=chk('lg-emom');
    else if(lvl===4){const r=num($('#lg-rounds').value);if(r!==null){if(r<0||r>60||Math.floor(r)!==r){toast(tr('tt.rounds'));return;}s.data.rounds=r;}}
    else if(lvl===5)s.data.held=chk('lg-held');
    else s.data.pace6=chk('lg-pace6');
  }
  FLAG_KEYS.forEach(k=>{if(chk('lg-f-'+k))s.flags[k]=true;});
  let warn=null;
  if(s.data.test){
    const prev=S.sessions.filter(x=>x.type==='muscu'&&x.data&&x.data.test&&x.data.test.reps===s.data.test.reps&&x.date<date).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)[0];
    if(prev){const wks=Math.max(1,Math.floor((dn(date)-dn(prev.date))/7));if(s.data.test.kg-prev.data.test.kg>2.5*wks+1e-9)warn=tr('tt.warnFast',{s:fmtShort(dn(prev.date))});}
    if(s.data.test.rpe>=9.5)warn=(warn?warn+' ':'')+tr('tt.never10');
  }
  const before=new Set(C.events.map(evKey));
  S.sessions.push(s);persist();
  ui.logOpen=false;ui.logType=null;ui.logDate=null;ui.flash=warn;
  render();
  const fresh=C.events.filter(ev=>!before.has(evKey(ev)));
  if(anyFlag(s.flags))toast(tr('tt.savedStop'));
  else if(fresh.length)toast(eventText(fresh[fresh.length-1]));
  else toast(tr('tt.sessionSaved'));
  window.scrollTo(0,0);
}

function saveCheckin(){
  const td=todayStr(),date=$('#ci-date').value||td;
  if(date>td){toast(tr('tt.future'));return;}
  const e={},sleep=num($('#ci-sleep').value),weight=num($('#ci-weight').value),waist=num($('#ci-waist').value);
  if(sleep!==null){if(sleep<0||sleep>16){toast(tr('tt.sleepRange'));return;}e.sleep=sleep;}
  if(weight!==null){if(weight<40||weight>200){toast(tr('tt.checkWeight'));return;}e.weight=weight;}
  if(waist!==null){if(waist<50||waist>160){toast(tr('tt.checkWaist'));return;}e.waist=waist;}
  const meals=segVal('meals'),wh=segVal('whisky'),back=segVal('back');
  if(meals!==null)e.meals=Number(meals);
  if(wh!==null)e.whisky=wh==='yes';
  if(back!==null)e.back=Number(back);
  if(Object.keys(e).length)S.daily[date]=e;else delete S.daily[date];
  persist();ui.ciDate=date===td?null:date;render();toast(tr('tt.ciSaved'));
}

function saveSetup(){
  const d=$('#su-start').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast(tr('tt.pickStart'));return;}
  if(d>todayStr()){toast(tr('tt.startFuture'));return;}
  const w=num($('#su-weight').value),wa=num($('#su-waist').value),h=num($('#su-height').value);
  S.profile.startDate=d;if(w!==null)S.profile.startWeight=w;if(wa!==null)S.profile.startWaist=wa;if(h!==null)S.profile.height=h;
  persist();render();toast(tr('tt.saved'));
}

const H={
  'toggle-log':()=>{ui.logOpen=!ui.logOpen;if(!ui.logOpen){ui.logType=null;ui.logDate=null;}renderNext();if(ui.logOpen){const f=$('#log-form');if(f)f.scrollIntoView({block:'nearest'});}},
  'clear-day':b=>arm(b,()=>{delete S.daily[ui.ciDate||todayStr()];persist();render();toast(tr('tt.dayCleared'));}),
  'del':b=>arm(b,()=>{S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);persist();render();toast(tr('tt.sessionDeleted'));}),
  'copy-sum':()=>{const ta=$('#sum-text');copyText(ta.value,ta,tr('tt.sumCopied'));},
  'copy-backup':()=>{const code=JSON.stringify(S),ta=$('#backup-text');ta.hidden=false;ta.value=code;copyText(code,ta,tr('tt.backupCopied'));
    if(!demo){S.meta.lastBackup=todayStr();persist();const lb=$('#last-backup');if(lb)lb.textContent=fmtDay(dn(S.meta.lastBackup));renderAlerts();}},
  'restore':b=>{let s=null;try{s=JSON.parse(($('#restore-text').value||'').trim());}catch(e){}
    if(!valid(s)){toast(tr('tt.badBackup'));return;}
    arm(b,()=>{if(!s.meta)s.meta={lastBackup:null};S=s;demo=false;REAL=null;persist();ui.logOpen=false;render();toast(tr('tt.restored'));});},
  'demo':()=>{REAL=S;S=generateDemo(todayStr());demo=true;ui.logOpen=false;ui.flash=null;render();showTab('today');toast(tr('tt.exOn'));},
  'exit-demo':()=>{if(REAL)S=REAL;REAL=null;demo=false;ui.logOpen=false;ui.flash=null;render();toast(tr('tt.exOff'));},
  'reset':b=>arm(b,()=>{S=freshState(todayStr());S.meta.credited='reset';demo=false;REAL=null;persist();ui.logOpen=false;ui.flash=null;render();toast(tr('tt.allDeleted'));}),
  'goto':b=>showTab(b.dataset.to),
  'dismiss':()=>{ui.flash=null;renderAlerts();},
  'lang':b=>{const l=E.setLang(b.dataset.lang);try{localStorage.setItem(LANGKEY,l);}catch(e){}render();}
};

document.addEventListener('click',e=>{
  const seg=e.target.closest('.seg button');
  if(seg){const was=seg.getAttribute('aria-pressed')==='true';seg.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));if(!was)seg.setAttribute('aria-pressed','true');return;}
  const tb=e.target.closest('[data-tab]');if(tb){showTab(tb.dataset.tab);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=H[b.dataset.act];if(f){e.preventDefault();f(b);}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='log-form')saveLog();
  else if(e.target.id==='ci-form')saveCheckin();
  else if(e.target.id==='setup-form')saveSetup();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='lg-type'){ui.logType=e.target.value;const d=$('#lg-date');ui.logDate=d?d.value:null;renderNext();}
  else if(id==='lg-date')ui.logDate=e.target.value;
  else if(id==='ci-date'){ui.ciDate=e.target.value||null;renderCheckin();}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&renderedDay!==todayStr())render();});

render();
const hash=(location.hash||'').slice(1);
let first='today';
if(TABS.indexOf(hash)>=0)first=hash;else{try{const s=localStorage.getItem(UIKEY);if(TABS.indexOf(s)>=0)first=s;}catch(e){}}
showTab(first);
})();
</script>
